name: Testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  # À mão, dá para rodar no macOS os testes completos, que sem isso só rodam antes de publicar
  workflow_dispatch:
    inputs:
      completo:
        description: "macOS com os testes completos"
        type: boolean
        default: false
  # Uma vez por semana, mesmo sem mudança nenhuma: os testes completos instalam o yt-dlp mais novo, e é ele
  # que muda (junto com os sites). Melhor saber aqui do que por quem usa.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Um envio novo na mesma branch cancela a rodada que ficou velha. Uma versão (etiqueta) nunca é cancelada.
concurrency:
  group: testes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck -s bash -S warning grabit.sh testes/rodar.sh packaging/apt/*.sh

  completos:
    # Os testes que baixam de verdade (yt-dlp e FFmpeg contra um servidor local) usam muito processador:
    # metade dos grupos em cada máquina, ao mesmo tempo. Os rápidos já rodam no WSL (Ubuntu), no macOS e
    # no Bash 4.4, e aqui ficam de fora.
    name: Testes completos (Ubuntu ${{ matrix.parte }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - parte: 1/2
            grupos: direto partes retomar protegidos baixar
          - parte: 2/2
            grupos: medidas pagina formato colecao
    steps:
      - uses: actions/checkout@v5
      # Os .deb do FFmpeg (mais de cem pacotes) ficam no cache do GitHub, um por versão da imagem do runner:
      # o espelho do Ubuntu às vezes leva minutos para entregá-los
      - id: imagem
        run: echo "nome=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/cache-apt
          key: apt-${{ steps.imagem.outputs.nome }}
      - name: Dependências
        run: |
          mkdir -p ~/cache-apt/partial
          rede="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dir::Cache::Archives=$HOME/cache-apt"
          # Com o cache cheio, nem o índice precisa vir: só se faltar algo é que o apt vai ao espelho
          if ! sudo apt-get $rede install -y -qq --no-install-recommends ffmpeg aria2; then
            sudo apt-get $rede update -qq
            sudo apt-get $rede install -y -qq --no-install-recommends ffmpeg aria2
          fi
          sudo chown -R "$USER" ~/cache-apt
          pipx install "yt-dlp[default]" || { sleep 10; pipx install "yt-dlp[default]"; }
      - name: Testes
        env:
          GRABIT_TESTES_GRUPOS: ${{ matrix.grupos }}
        run: bash testes/rodar.sh

  pacote-apt:
    name: Pacote .deb e repositório APT
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Instala, atualiza e remove pelo apt
        # No próprio runner, que é descartável e já tem as ferramentas do teste: ele roda sem rede nenhuma
        # (veja o testar.sh). Fora da CI, o mesmo teste roda num contêiner limpo do Ubuntu.
        run: sudo bash packaging/apt/testar.sh

  bash-minimo:
    # O mínimo que o README promete. O Bash mais novo já é testado no Ubuntu e no macOS, na suíte completa.
    name: Bash 4.4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Testes rápidos
        run: docker run --rm -v "$PWD:/grabit" -w /grabit "bash:4.4" bash testes/rodar.sh --rapido

  wsl:
    # No Windows, o GrabIt roda pelo WSL. Os testes rápidos, numa distribuição de verdade dentro do Windows.
    name: Windows (WSL)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@v5
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4   # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3 git
      # Sem as pastas do Windows no PATH: no WSL do runner (o WSL1), cada programa procurado e não achado
      # varreria dezenas delas, e os testes procuram muitos (é assim que o GrabIt descobre o que há)
      - name: Testes rápidos no WSL
        run: |
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/mnt/' | paste -sd: -)
          bash testes/rodar.sh --rapido

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # O Homebrew sem se atualizar nem conferir o resto a cada install: só o que o teste precisa
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v5
      - name: O Bash 3.2 do sistema é recusado com uma mensagem clara
        run: |
          set +e
          saida=$(/bin/bash grabit.sh -h 2>&1); rc=$?
          echo "$saida"
          [ "$rc" = 1 ] && echo "$saida" | grep -q "Bash 4.4"
      # A cada envio, os testes rápidos; antes de publicar uma versão, todos
      - name: Testes rápidos com o Bash do Homebrew
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.completo }}
        run: |
          brew install bash
          "$(brew --prefix)/bin/bash" testes/rodar.sh --rapido
      - name: Dependências dos testes completos
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.completo }}
        run: |
          brew install bash ffmpeg aria2 pipx
          pipx install "yt-dlp[default]"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Testes completos com o Bash do Homebrew
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.completo }}
        run: |
          "$(brew --prefix)/bin/bash" testes/rodar.sh
