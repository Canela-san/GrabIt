name: Testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  # À mão, dá para rodar no macOS os testes completos, que sem isso só rodam antes de publicar
  workflow_dispatch:
    inputs:
      completo:
        description: "macOS com os testes completos"
        type: boolean
        default: false
  # Uma vez por semana, mesmo sem mudança nenhuma: os testes completos instalam o yt-dlp mais novo, e é ele
  # que muda (junto com os sites). Melhor saber aqui do que por quem usa.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Um envio novo na mesma branch cancela a rodada que ficou velha. Uma versão (etiqueta) nunca é cancelada.
concurrency:
  group: testes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  completos:
    name: Testes completos (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg shellcheck aria2
          pipx install "yt-dlp[default]"
      - name: ShellCheck
        run: shellcheck -s bash -S warning grabit.sh testes/rodar.sh packaging/apt/*.sh
      - name: Testes
        run: bash testes/rodar.sh

  pacote-apt:
    name: Pacote .deb e repositório APT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Instala, atualiza e remove pelo apt
        # Dentro do contêiner, o espelho do Ubuntu na Azure, o mesmo que o runner usa: quando o
        # archive.ubuntu.com sai do ar, o teste não fica parado até o tempo acabar
        run: |
          docker run --rm -v "$PWD:/grabit:ro" -w /grabit ubuntu:24.04 bash -c \
            "sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources && bash packaging/apt/testar.sh"

  bash-minimo:
    # O mínimo que o README promete. O Bash mais novo já é testado no Ubuntu e no macOS, na suíte completa.
    name: Bash 4.4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Testes rápidos
        run: docker run --rm -v "$PWD:/grabit" -w /grabit "bash:4.4" bash testes/rodar.sh --rapido

  wsl:
    # No Windows, o GrabIt roda pelo WSL. Os testes rápidos, numa distribuição de verdade dentro do Windows.
    name: Windows (WSL)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@v5
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4   # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3 git
      - name: Testes rápidos no WSL
        run: bash testes/rodar.sh --rapido

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: O Bash 3.2 do sistema é recusado com uma mensagem clara
        run: |
          set +e
          saida=$(/bin/bash grabit.sh -h 2>&1); rc=$?
          echo "$saida"
          [ "$rc" = 1 ] && echo "$saida" | grep -q "Bash 4.4"
      # A cada envio, os testes rápidos; antes de publicar uma versão, todos
      - name: Testes rápidos com o Bash do Homebrew
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.completo }}
        run: |
          brew install bash
          "$(brew --prefix)/bin/bash" testes/rodar.sh --rapido
      - name: Dependências dos testes completos
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.completo }}
        run: |
          brew install bash ffmpeg aria2 pipx
          pipx install "yt-dlp[default]"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Testes completos com o Bash do Homebrew
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.completo }}
        run: |
          "$(brew --prefix)/bin/bash" testes/rodar.sh
